<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Strava Overlay Tool</title>
<link rel="stylesheet" href="styles.css" />

<header class="topbar">
  <h1>Strava Overlay</h1>
  <p class="tagline">Drop a Strava stats image on top of any photo.</p>
</header>

<main>
  <!-- Step 1 + 2: pick the two images -->
  <section class="controls">
    <label class="filebtn">
      <input type="file" id="baseInput" accept="image/*" />
      <span>1 · Base image</span>
    </label>

    <label class="filebtn" id="overlayLabel">
      <input type="file" id="overlayInput" accept="image/*" />
      <span>2 · Strava overlay</span>
    </label>
  </section>

  <!-- The interactive preview -->
  <div id="placeholder" class="placeholder">
    <p>Pick a <strong>base image</strong> to start.</p>
    <p class="hint">Then add the Strava overlay — drag it to move, pinch / scroll / slider to resize.</p>
  </div>

  <div id="stage" class="stage" hidden>
    <img id="baseImg" alt="base" />
    <img id="overlayImg" class="overlay" alt="overlay" hidden />
  </div>

  <!-- Size + actions -->
  <section class="controls controls--bottom" id="bottomControls" hidden>
    <label class="slider">
      <span>Size</span>
      <input type="range" id="sizeSlider" min="5" max="100" step="0.5" value="50" />
    </label>
    <button id="resetBtn" class="btn btn--ghost" type="button">Reset</button>
    <button id="downloadBtn" class="btn" type="button" disabled>Download PNG</button>
  </section>
</main>

<script src="app.js"></script>
